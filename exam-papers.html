<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Papers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background: #0073e6;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      border-bottom: 2px solid #0073e6;
      padding-bottom: 5px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 15px 0;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    a {
      text-decoration: none;
      margin-right: 10px;
      color: #0073e6;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    .embed-container {
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }
    embed {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
